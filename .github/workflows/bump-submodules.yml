name: Bump submodules

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update all submodules to latest
        run: git submodule update --remote

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build commit message
        if: steps.changes.outputs.changed == 'true'
        id: message
        run: |
          {
            echo 'body<<EOF'
            git diff --name-only | while read -r sub; do
              old=$(git diff -- "$sub" | grep -oP '(?<=^-Subproject commit )\w+')
              new=$(git diff -- "$sub" | grep -oP '(?<=^\+Subproject commit )\w+')
              url=$(git config --file .gitmodules "submodule.${sub}.url" | sed 's/\.git$//')
              echo "### ${sub}"
              echo "[\`${old:0:7}\` → \`${new:0:7}\`](${url}/compare/${old}...${new})"
              git -C "$sub" fetch --unshallow 2>/dev/null || true
              commits=$(git -C "$sub" log --oneline --no-decorate "${old}..${new}" 2>/dev/null || true)
              if [ -n "$commits" ]; then
                echo "$commits" | while IFS= read -r line; do
                  hash=${line%% *}
                  msg=${line#* }
                  echo "- [\`${hash}\`](${url}/commit/${hash}) ${msg}"
                done
              fi
              echo ""
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump submodules"
          branch: auto/bump-submodules
          delete-branch: true
          title: "Bump submodules"
          body: ${{ steps.message.outputs.body }}
